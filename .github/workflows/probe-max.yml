# One-off probe: can a GitHub runner reach MAX / BitoPro public APIs? Remove after reading the log.
name: probe-max
on:
  push:
    branches: [claude/project-thread-4hhtb5]
    paths: [.github/workflows/probe-max.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            'https://max-api.maicoin.com/api/v2/depth?market=usdttwd&limit=1' \
            'https://max-api.maicoin.com/api/v3/depth?market=usdttwd&limit=1' \
            'https://max-api.maicoin.com/api/v2/tickers/usdttwd' \
            'https://api.bitopro.com/v3/order-book/usdt_twd?limit=1' \
            'https://api.bitopro.com/v3/price/otc/usdt'; do
            echo "=== $u"
            curl -sS -m 20 -D - -H 'Origin: https://dennyhty.github.io' "$u" | grep -iv '^set-cookie' | head -c 1500 || true
            echo
          done
