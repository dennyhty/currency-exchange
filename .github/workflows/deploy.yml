name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Build the Pages artifact on PRs too, so a broken build is caught before merge.
  pull_request:
  workflow_dispatch:
  # Refresh rates.json (E.SUN's USD/TWD board rate) once a day at 09:00 Taipei (01:00 UTC).
  # GitHub may start scheduled runs late, especially at the top of the hour.
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Keep the last good values when a source is down: start from the currently published file.
      - name: Fetch previous rates.json
        run: curl -fsS -m 20 -o previous-rates.json "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/rates.json" || echo "no previous snapshot"
      - name: Fetch rates
        run: node scripts/fetch-snapshot.ts --out public/rates.json --prev previous-rates.json

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Once a day, append every source's rates to history.json on the `data` branch (the site's trend chart).
  history:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: data-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Check out the data branch
        run: |
          if git fetch --depth 1 origin data; then
            git worktree add -B data data-branch FETCH_HEAD
          else
            git worktree add --orphan -b data data-branch
          fi

      - name: Record today's rates
        run: node scripts/record-history.ts --file data-branch/history.json --gola data-branch/golavisa.json

      - name: Commit and push
        working-directory: data-branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history.json
          git commit -m "data: rate history $(TZ=Asia/Taipei date +%F)"
          # golavisa.json may have been published meanwhile: replay our commit on top and retry
          for i in 1 2 3; do
            git push origin data && exit 0
            sleep $((i * 5))
            git pull --rebase origin data
          done
          exit 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Scheduled workflows in a public repo are disabled after 60 days without activity;
      # re-enabling ourselves is a best-effort keepalive.
      - name: Keepalive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable deploy.yml --repo "$GITHUB_REPOSITORY" || true
