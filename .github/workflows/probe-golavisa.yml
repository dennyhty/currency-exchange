# TEMPORARY: one-off check of the GolaVisa JSON API from a GitHub runner. Delete after use.
name: probe-golavisa (temporary)
on:
  push:
    branches: [claude/focused-curie-di0jvs]
    paths: [.github/workflows/probe-golavisa.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/exchange-rates (plain, with Origin to see CORS)
        run: |
          curl -sS -i -m 30 -H 'Accept: application/json' -H 'User-Agent: Mozilla/5.0' \
            -H 'Origin: https://dennyhty.github.io' https://www.golavisa.co/api/exchange-rates \
            | head -c 6000 || true
      - name: preflight
        run: |
          curl -sS -i -m 30 -X OPTIONS -H 'Origin: https://dennyhty.github.io' \
            -H 'Access-Control-Request-Method: GET' https://www.golavisa.co/api/exchange-rates | head -c 1500 || true
