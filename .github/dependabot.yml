version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    # @types/node follows the Node version in .nvmrc; bump it together with Node, not on its own.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint does not accept TypeScript 7 as a peer yet; bump TS major once it does.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
